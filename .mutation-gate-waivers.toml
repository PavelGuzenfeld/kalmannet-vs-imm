[[waiver]]
file = "scripts/make_plots.py"
uncovered = true
reason = """It only arranges matplotlib figures from results/*.json and *.csv.
Its output is a PNG judged by eye, so a mutant like an annotation offset 6 => 7
has no assertable consequence; asserting on pixels would pin the current
rendering, not a requirement. The numbers it draws are produced and checked in
scripts/eval.py and filters/metrics.py, and the CSV/filter selection, tuned-IMM
kwargs, and latency-series logic it used to inline are now filters/plot_data.py
(reusing filters/metrics.py's per_step_rmse for the RMSE-vs-time formula too),
all of which are gated."""

[[waiver]]
file = "filters/knet/rkn_filter.py"
line = 43
old = "-1"
new = "1"
reason = """`torch.cat(..., dim=-1)` on 2-D tensors: dim=-1 and dim=1 are the same
axis, so this mutant is equivalent and no test can distinguish it. Line 43 carries
a second `-1` (the H_t.reshape flatten) which this waiver's shape cannot exclude;
that one is killed by test_feature_vector_is_the_specified_squared_quadruple, which
pins the full 48-wide feature vector."""

