file = "filters/knet/ukn_filter.py"
line = 49
old = "STATE_DIM + ukf.lam"
new = "STATE_DIM - ukf.lam"
reason = """The sigma-point spread n + lambda, with lambda = alpha^2 (n + kappa) - n = 0 at the MS-9
constants alpha = 1, kappa = 0 that every UKF and UKN here runs at, so n - lambda is the same number.
Rebuilt and diffed: a two-trajectory batched run gives bitwise-equal x and P. The term stays so the
torch backbone reads the same lambda as filters/ukf.py if MS-9 ever moves."""

