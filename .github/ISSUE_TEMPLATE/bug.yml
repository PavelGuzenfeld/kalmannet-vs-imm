name: Bug
description: Something does not do what it says
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Repro steps
      placeholder: Commands and files needed to see it again
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: input
    id: ref
    attributes:
      label: Ref or version
      placeholder: "<branch-or-tag>@<sha>, or a release version"
    validations:
      required: true
