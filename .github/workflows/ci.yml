name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: 0.8.4

  # Tests and smoke share one image build; splitting them would pay the torch
  # pull twice for a suite that finishes in seconds.
  test:
    runs-on: ubuntu-latest
    env:
      BENCH_IMAGE_PREBUILT: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build bench image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: kalmannet-bench:cpu
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Unit tests
        run: ./docker_run.sh pytest -q

      # The unit tests import the packages directly and so never execute an
      # entrypoint. This runs the documented pipeline at toy sizes, on its
      # default output paths, which is what caught `python scripts/make_dataset.py`
      # failing on sys.path while all 38 tests were green.
      - name: Smoke the documented pipeline
        run: |
          ./docker_run.sh python scripts/make_dataset.py \
            --n-train 4 --n-val 4 --n-test 4 --n-sweep 2 \
            --mc-test 2 --n-highmc 2 --mc-highmc 3
          ./docker_run.sh python scripts/tune_imm.py --n-search 2 --allow-edge-selection
          ./docker_run.sh python scripts/eval.py
          ./docker_run.sh python scripts/bench_latency.py --n-warmup 5 --n-measure 50
          test -s results/results_table.csv
          test -s results/anees_highmc.json

  # Chromium runs the committed scenarios through the page; the expected flags
  # come from replay.py in the bench image, so the two never share an implementation.
  page-flags:
    runs-on: ubuntu-latest
    env:
      BENCH_IMAGE_PREBUILT: "1"
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright/python:v1.48.0-jammy
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build bench image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: kalmannet-bench:cpu
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Native flags and trip steps for the browser cases
        run: |
          ./docker_run.sh python scripts/page_parity.py cases build/browser
          mkdir -p build/replay
          for scenario in break_turn_9g overhead_pass; do
            ./docker_run.sh python scripts/replay.py data/scenarios/$scenario.json \
              --imm-tuning web/imm_tuning.json > build/replay/$scenario.txt
          done

      - name: Page flags and trip markers equal native replay
        run: |
          docker run --rm --ipc=host -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD":/w -w /w "$PLAYWRIGHT_IMAGE" sh -c '
            set -e
            pip install -q pytest==8.3.3 playwright==1.48.0
            python -m http.server 8000 >/dev/null 2>&1 &
            sleep 1
            PAGE_BASE_URL=http://localhost:8000 python -m pytest -q -p no:cacheprovider tests/test_page_flags_browser.py tests/test_steering_hud_browser.py
            python tests/browser/slice_page_views.py http://localhost:8000 build/replay'

  site-docs:
    runs-on: ubuntu-latest
    env:
      BENCH_IMAGE_PREBUILT: "1"
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright/python:v1.48.0-jammy
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build bench image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: kalmannet-bench:cpu
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build site
        run: ./docker_run.sh python scripts/build_site.py --tag ci

      - name: Write-up opens from the landing page with its table rendered
        run: |
          docker run --rm --ipc=host -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD":/w -w /w "$PLAYWRIGHT_IMAGE" sh -c '
            set -e
            pip install -q pytest==8.3.3 playwright==1.48.0
            mkdir /srv/root
            ln -s /w/_site /srv/root/kalmannet-vs-imm
            python -m http.server 8000 --directory /srv/root >/dev/null 2>&1 &
            sleep 1
            SITE_BASE_URL=http://localhost:8000/kalmannet-vs-imm python -m pytest -q -p no:cacheprovider tests/test_site_docs_browser.py'

  # Informational: how far Pyodide's numpy drifts from native on the committed scenarios.
  pyodide-drift:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      BENCH_IMAGE_PREBUILT: "1"
      NODE_IMAGE: node:22.12.0-slim
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v4
        with:
          path: .cache/pyodide-npm
          key: pyodide-npm-${{ hashFiles('web/protocol.js') }}

      - uses: docker/setup-buildx-action@v4

      - name: Build bench image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: kalmannet-bench:cpu
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trace the scenarios in Pyodide
        run: |
          PYODIDE_VERSION=$(grep -o 'v[0-9.]*/full' web/protocol.js | cut -c2- | cut -d/ -f1)
          mkdir -p build
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/w -w /w "$NODE_IMAGE" sh -c "
            npm install --no-audit --no-fund --prefix .cache/pyodide-npm pyodide@$PYODIDE_VERSION
            node scripts/pyodide_trace.mjs /w/.cache/pyodide-npm/node_modules/pyodide/pyodide.mjs \
              build/pyodide_trace.json data/scenarios/*.json"

      - name: Report drift against native
        run: |
          ./docker_run.sh python scripts/page_parity.py drift build/pyodide_trace.json | tee -a "$GITHUB_STEP_SUMMARY"
