name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  BENCH_IMAGE_PREBUILT: "1"

jobs:
  dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build bench image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: kalmannet-bench:cpu
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Generate datasets
        run: |
          ./docker_run.sh python scripts/make_dataset.py
      - uses: actions/upload-artifact@v7
        with:
          name: datasets
          path: datasets/

  train-knet:
    needs: dataset
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build bench image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: kalmannet-bench:cpu
          load: true
          cache-from: type=gha
      - uses: actions/download-artifact@v8
        with:
          name: datasets
          path: datasets/
      - name: Train KalmanNet
        run: |
          ./docker_run.sh python scripts/train_knet.py
          ./docker_run.sh python scripts/export_weights.py results/knet_vanilla/best.pt
      - uses: actions/upload-artifact@v7
        with:
          name: knet-checkpoint
          path: results/knet_vanilla/

  train-rkn:
    needs: dataset
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build bench image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: kalmannet-bench:cpu
          load: true
          cache-from: type=gha
      - uses: actions/download-artifact@v8
        with:
          name: datasets
          path: datasets/
      - name: Train RKN
        run: |
          ./docker_run.sh python scripts/train_rkn.py
          ./docker_run.sh python scripts/export_weights.py results/rkn/best.pt
      - uses: actions/upload-artifact@v7
        with:
          name: rkn-checkpoint
          path: results/rkn/

  train-bkn:
    needs: dataset
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build bench image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: kalmannet-bench:cpu
          load: true
          cache-from: type=gha
      - uses: actions/download-artifact@v8
        with:
          name: datasets
          path: datasets/
      - name: Train Bayesian KalmanNet
        run: |
          ./docker_run.sh python scripts/train_knet.py --dropout-p 0.2 --out results/bkn
          ./docker_run.sh python scripts/export_weights.py results/bkn/best.pt
      - uses: actions/upload-artifact@v7
        with:
          name: bkn-checkpoint
          path: results/bkn/

  train-ukn:
    needs: dataset
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build bench image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: kalmannet-bench:cpu
          load: true
          cache-from: type=gha
      - uses: actions/download-artifact@v8
        with:
          name: datasets
          path: datasets/
      - name: Train Unscented KalmanNet
        run: |
          ./docker_run.sh python scripts/train_ukn.py --out results/ukn
          ./docker_run.sh python scripts/export_weights.py results/ukn/best.pt
      - uses: actions/upload-artifact@v7
        with:
          name: ukn-checkpoint
          path: results/ukn/

  train-ckn:
    needs: dataset
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build bench image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: kalmannet-bench:cpu
          load: true
          cache-from: type=gha
      - uses: actions/download-artifact@v8
        with:
          name: datasets
          path: datasets/
      - name: Train Cholesky-KalmanNet
        run: |
          ./docker_run.sh python scripts/train_ckn.py --out results/ckn
          ./docker_run.sh python scripts/export_weights.py results/ckn/best.pt
      - uses: actions/upload-artifact@v7
        with:
          name: ckn-checkpoint
          path: results/ckn/

  release:
    if: github.ref_type == 'tag'
    needs: [train-knet, train-rkn, train-bkn, train-ukn, train-ckn]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: knet-checkpoint
          path: knet/
      - uses: actions/download-artifact@v8
        with:
          name: rkn-checkpoint
          path: rkn/
      - uses: actions/download-artifact@v8
        with:
          name: bkn-checkpoint
          path: bkn/
      - uses: actions/download-artifact@v8
        with:
          name: ukn-checkpoint
          path: ukn/
      - uses: actions/download-artifact@v8
        with:
          name: ckn-checkpoint
          path: ckn/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets
          for model in knet rkn bkn ukn ckn; do
            for file in best.pt best.npz training_log.json; do
              cp "$model/$file" "assets/$model-$file"
            done
          done
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes assets/*

  site:
    if: github.ref_type == 'tag'
    needs: [train-knet, train-rkn, train-bkn, train-ukn, train-ckn]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build bench image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: kalmannet-bench:cpu
          load: true
          cache-from: type=gha
      - uses: actions/download-artifact@v8
        with:
          name: knet-checkpoint
          path: results/knet_vanilla/
      - uses: actions/download-artifact@v8
        with:
          name: rkn-checkpoint
          path: results/rkn/
      - uses: actions/download-artifact@v8
        with:
          name: bkn-checkpoint
          path: results/bkn/
      - uses: actions/download-artifact@v8
        with:
          name: ukn-checkpoint
          path: results/ukn/
      - uses: actions/download-artifact@v8
        with:
          name: ckn-checkpoint
          path: results/ckn/
      - name: Build site
        run: |
          ./docker_run.sh python scripts/build_site.py --tag "$GITHUB_REF_NAME"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

  deploy:
    if: github.ref_type == 'tag' && vars.PAGES_ENABLED == 'true'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
